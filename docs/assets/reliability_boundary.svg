<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">VeraNav reliability boundary</title>
  <desc id="desc">Deterministic figure generated from a VeraNav reliability study.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="92" y="34" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Adaptive GNSS-bias reliability boundary</text>
  <text x="92" y="57" font-family="Arial, sans-serif" font-size="13" fill="#5b6578">Illustrative deterministic synthetic study; not a safety claim</text>
  <rect x="92" y="78" width="762" height="360" fill="#f7f9fc" stroke="#c9d1df"/>
  <line x1="92" y1="438.000" x2="854" y2="438.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="442.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">0.0</text>
  <line x1="92" y1="378.000" x2="854" y2="378.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="382.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">2.0</text>
  <line x1="92" y1="318.000" x2="854" y2="318.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="322.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">4.0</text>
  <line x1="92" y1="258.000" x2="854" y2="258.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="262.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">6.0</text>
  <line x1="92" y1="198.000" x2="854" y2="198.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="202.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">8.0</text>
  <line x1="92" y1="138.000" x2="854" y2="138.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="142.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">10.0</text>
  <line x1="92" y1="78.000" x2="854" y2="78.000" stroke="#dce2ec" stroke-width="1"/>
  <text x="80" y="82.000" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5b6578">12.0</text>
  <line x1="92.000" y1="78" x2="92.000" y2="438" stroke="#e6eaf1" stroke-width="1"/>
  <text x="92.000" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">0</text>
  <line x1="92.000" y1="134.250" x2="92.000" y2="123.000" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
  <circle cx="92.000" cy="128.625" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="92.000" y="155.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">10.125-10.500 m</text>
  <line x1="473.000" y1="78" x2="473.000" y2="438" stroke="#e6eaf1" stroke-width="1"/>
  <text x="473.000" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">0.5</text>
  <circle cx="473.000" cy="78.000" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <path d="M 473.000 71.000 L 468.000 61.000 L 478.000 61.000 Z" fill="#15803d"/>
  <text x="473.000" y="105.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">reliable through 12.000 m</text>
  <line x1="854.000" y1="78" x2="854.000" y2="438" stroke="#e6eaf1" stroke-width="1"/>
  <text x="854.000" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">1</text>
  <circle cx="854.000" cy="78.000" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <path d="M 854.000 71.000 L 849.000 61.000 L 859.000 61.000 Z" fill="#15803d"/>
  <text x="854.000" y="105.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">reliable through 12.000 m</text>
  <text x="473.000" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#172033">GNSS outage duration (s)</text>
  <text x="24" y="258.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#172033" transform="rotate(-90 24 258.000)">GNSS bias magnitude (m)</text>
  <circle cx="627" cy="42" r="6" fill="#1d4ed8"/>
  <text x="641" y="46" font-family="Arial, sans-serif" font-size="11" fill="#334155">bounded transition</text>
  <circle cx="760" cy="42" r="6" fill="#15803d"/>
  <text x="774" y="46" font-family="Arial, sans-serif" font-size="11" fill="#334155">all reliable in range</text>
</svg>
