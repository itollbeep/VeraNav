<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VeraNav reliability evaluation architecture</title>
  <desc id="desc">Structured degradation, navigation estimation, paired Monte Carlo statistics, adaptive boundary search, and deterministic reports.</desc>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">VeraNav reliability-evaluation pipeline</text>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="14" fill="#5b6578">Estimator verification under structured sensor degradation</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="120" width="175" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="142.5" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Synthetic scenario</text>
    <text x="142.5" y="178" text-anchor="middle" font-size="13" fill="#334155">trajectory truth</text>
    <text x="142.5" y="198" text-anchor="middle" font-size="13" fill="#334155">IMU and GNSS streams</text>

    <rect x="275" y="120" width="175" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="362.5" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Degradation model</text>
    <text x="362.5" y="178" text-anchor="middle" font-size="13" fill="#334155">GNSS outage</text>
    <text x="362.5" y="198" text-anchor="middle" font-size="13" fill="#334155">position bias</text>

    <rect x="495" y="120" width="175" height="110" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="582.5" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Estimator adapter</text>
    <text x="582.5" y="178" text-anchor="middle" font-size="13" fill="#334155">V0.1 ESKF</text>
    <text x="582.5" y="198" text-anchor="middle" font-size="13" fill="#334155">future external baselines</text>

    <rect x="715" y="120" width="175" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="802.5" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Paired Monte Carlo</text>
    <text x="802.5" y="178" text-anchor="middle" font-size="13" fill="#334155">common random numbers</text>
    <text x="802.5" y="198" text-anchor="middle" font-size="13" fill="#334155">baseline vs degraded</text>

    <rect x="935" y="120" width="210" height="110" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="1040" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Reliability analysis</text>
    <text x="1040" y="178" text-anchor="middle" font-size="13" fill="#334155">confidence intervals</text>
    <text x="1040" y="198" text-anchor="middle" font-size="13" fill="#334155">adaptive boundary search</text>

    <line x1="230" y1="175" x2="270" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="175" x2="490" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="670" y1="175" x2="710" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="890" y1="175" x2="930" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="275" y="292" width="615" height="76" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="582.5" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Deterministic evidence package</text>
    <text x="582.5" y="346" text-anchor="middle" font-size="13" fill="#475569">JSON · CSV · Markdown · SVG · fixed seeds · unit tests · CI</text>

    <line x1="1040" y1="230" x2="1040" y2="330" stroke="#64748b" stroke-width="2.5"/>
    <line x1="1040" y1="330" x2="895" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
