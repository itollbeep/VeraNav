[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "veranav"
version = "0.1.0"
description = "A reproducible framework for evaluating navigation state estimators under sensor degradation and faults."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.2.6,<2.3"]

[tool.setuptools.packages.find]
where = ["src"]
