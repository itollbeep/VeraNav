name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m compileall -q src tests scripts
      - run: PYTHONPATH=src python scripts/run_reliability_study.py --quick --seeds 2 --output-dir /tmp/veranav-study
      - run: PYTHONPATH=src python scripts/render_study_svg.py /tmp/veranav-study/study.json /tmp/veranav-study
      - run: PYTHONPATH=src python scripts/run_adapter_smoke.py --output-dir /tmp/veranav-adapter --seed 0
